window.__SERIES_META = [["unfiltered_none_x50", "未筛 · x50", "#2962ff", "--"], ["avg5_gt2m_none_x50", "均额>$2M · x50", "#2962ff", "-"], ["unfiltered_none_x5", "未筛 · x5", "#ff9800", "--"], ["avg5_gt2m_none_x5", "均额>$2M · x5", "#ff9800", "-"], ["unfiltered_sl20_x50", "未筛 · SL20/x50", "#26a69a", "--"], ["avg5_gt2m_sl20_x50", "均额>$2M · SL20/x50", "#26a69a", "-"], ["unfiltered_sl20_x5", "未筛 · SL20/x5", "#ef5350", "--"], ["avg5_gt2m_sl20_x5", "均额>$2M · SL20/x5", "#ef5350", "-"]];
</script>
<script>
'use strict';
const D = window.__DATA;
const SM = window.__SERIES_META;
const $ = id => document.getElementById(id);
const pct = v => (v==null||!isFinite(v)) ? '—' : ((v*100).toFixed(0)+'%');
const cagrPct = v => (v==null||!isFinite(v)) ? '—' : ((v*100).toFixed(0)+'%'); // cagr already as multiplier-1? No: stored as 7.3 means 730%
// In summary, cagr=7.309 means +730.9% (ann). Display as +731%
const fmtCagr = v => (v==null||!isFinite(v)) ? '—' : ((v>=0?'+':'')+(v*100).toFixed(0)+'%');
const fmtSh = v => (v==null||!isFinite(v)) ? '—' : v.toFixed(2);
const fmtMdd = v => (v==null||!isFinite(v)) ? '—' : ((v*100).toFixed(1)+'%');
const fmtBp = v => (v==null||!isFinite(v)) ? '—' : ((v>=0?'+':'')+v.toFixed(1));
const fmtWin = v => (v==null||!isFinite(v)) ? '—' : ((v*100).toFixed(1)+'%');
const cls = v => v>0?'pos':(v<0?'neg':'');
const FLAB = {unfiltered:'未筛', avg5_gt2m:'均额>$2M'};
const ELAB = {none_x50:'跌出 top50%', none_x5:'跌出 top5%', sl20_x50:'SL20 + top50%', sl20_x5:'SL20 + top5%'};

document.getElementById('title').textContent = D.meta.title;
document.getElementById('subtitle').textContent =
  D.meta.ckpt + ' · ' + D.meta.fee + ' · sizing ' + D.meta.sizing + ' · seed ' + D.meta.seed;
document.getElementById('png').src = window.__PNG;

const fs = D.meta.filter_stats;
const valX50u = D.rows.find(r=>r.filter==='unfiltered'&&r.exit==='none_x50'&&r.half==='VAL');
const valX50f = D.rows.find(r=>r.filter==='avg5_gt2m'&&r.exit==='none_x50'&&r.half==='VAL');
const valX5u = D.rows.find(r=>r.filter==='unfiltered'&&r.exit==='none_x5'&&r.half==='VAL');
const valX5f = D.rows.find(r=>r.filter==='avg5_gt2m'&&r.exit==='none_x5'&&r.half==='VAL');

$('cards').innerHTML = [
  ['VAL 未筛 x50 CAGR', fmtCagr(valX50u.cagr), 'Sh '+fmtSh(valX50u.sharpe)+' · n='+valX50u.n_kept_A],
  ['VAL 筛后 x50 CAGR', fmtCagr(valX50f.cagr), 'Sh '+fmtSh(valX50f.sharpe)+' · n='+valX50f.n_kept_A],
  ['VAL 未筛 x5 CAGR', fmtCagr(valX5u.cagr), 'Sh '+fmtSh(valX5u.sharpe)+' · n='+valX5u.n_kept_A],
  ['VAL 筛后 x5 CAGR', fmtCagr(valX5f.cagr), 'Sh '+fmtSh(valX5f.sharpe)+' · n='+valX5f.n_kept_A],
  ['空头信号保留', (fs.frac_short_kept*100).toFixed(1)+'%', fs.n_short_liq+' / '+fs.n_short_unf],
  ['筛后 mean5 中位', '$'+(fs.mean5_on_short_liq_p50/1e6).toFixed(2)+'M', '未筛中位 $'+(fs.mean5_on_short_unf_p50/1e3).toFixed(1)+'k'],
].map(([k,v,s])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join('');

$('filtNote').innerHTML = `
<p><b>规则</b>：只做空 <code>pos &lt; -0.98</code>；全市场 RTH、$10–100 截面（非 PIT top1000）；进场 t+1 open，出场跌出截面 |pos| 前 X%（或 SL20）。</p>
<p><b>流动性筛</b>：决策时点用过去 5 根 RTH bar 的美元成交额均值 <code>mean5</code>，只保留 <code>mean5 &gt; $2,000,000</code>（等价 $10 万全仓一只吃不到单根均额的 5%）。</p>
<p>未筛空头信号 ${fs.n_short_unf.toLocaleString()} 笔 → 筛后 ${fs.n_short_liq.toLocaleString()}（保留 ${(fs.frac_short_kept*100).toFixed(1)}%）。
截面中位约 ${D.rows.find(r=>r.half==='VAL').univ_names_per_ts_median|0} 名/时点。
H1 ${D.meta.halves.H1[0]}–${D.meta.halves.H1[1]}，H2 ${D.meta.halves.H2[0]}–${D.meta.halves.H2[1]}。</p>
<p>${D.meta.why || ''}</p>`;

$('tradeNote').innerHTML = D.meta.note_trades +
  '<br>未筛逐笔可看：<code>file:///workspace/e1fv2_fullval_19400/e1_pos098_short_rerun/dashboard/index.html</code>';

$('foot').textContent = '数据目录 /workspace/e1fv2_short_avg5_lt5pct/ · 打开本文件即可（file://）';

// ----- table -----
let sortKey = 'cagr', sortDir = -1;
function filteredRows(){
  const h=$('half').value, f=$('filt').value, e=$('exit').value;
  return D.rows.filter(r =>
    (h==='ALL'||r.half===h) && (f==='ALL'||r.filter===f) && (e==='ALL'||r.exit===e)
  ).slice().sort((a,b)=>{
    const av=a[sortKey], bv=b[sortKey];
    if(av==null&&bv==null) return 0;
    if(av==null) return 1; if(bv==null) return -1;
    if(av<bv) return -sortDir; if(av>bv) return sortDir; return 0;
  });
}
function renderTable(){
  const tb = $('tbl').querySelector('tbody');
  tb.innerHTML = filteredRows().map(r => `<tr>
    <td>${FLAB[r.filter]||r.filter}</td>
    <td>${ELAB[r.exit]||r.exit}</td>
    <td>${r.half}</td>
    <td class="${cls(r.cagr)}">${fmtCagr(r.cagr)}</td>
    <td class="${cls(r.sharpe)}">${fmtSh(r.sharpe)}</td>
    <td class="neg">${fmtMdd(r.mdd)}</td>
    <td>${r.n_kept_A}</td>
    <td class="${cls(r.mean_bps)}">${fmtBp(r.mean_bps)}</td>
    <td>${fmtWin(r.win)}</td>
    <td>${(r.trades_per_day_kept||0).toFixed(1)}</td>
    <td>${r.n_stop_kept||0}</td>
  </tr>`).join('');
}
$('half').onchange=$('filt').onchange=$('exit').onchange=renderTable;
document.querySelectorAll('#tbl th').forEach(th=>{
  th.onclick=()=>{ const k=th.dataset.k; if(sortKey===k) sortDir*=-1; else {sortKey=k; sortDir=(k==='filter'||k==='exit'||k==='half')?1:-1;} renderTable(); };
});
renderTable();

// ----- chart -----
const presets = {
  compare_x50: ['unfiltered_none_x50','avg5_gt2m_none_x50'],
  compare_x5: ['unfiltered_none_x5','avg5_gt2m_none_x5'],
  compare_sl: ['unfiltered_sl20_x5','avg5_gt2m_sl20_x5'],
  filtered: SM.filter(x=>x[0].startsWith('avg5')).map(x=>x[0]),
  unfiltered: SM.filter(x=>x[0].startsWith('unfiltered')).map(x=>x[0]),
  all: SM.map(x=>x[0]),
};
let enabled = new Set(presets.compare_x50);

function buildLegend(){
  $('legend').innerHTML = SM.map(([id,lab,col,dash])=>{
    const checked = enabled.has(id) ? 'checked' : '';
    return `<label><input type="checkbox" data-id="${id}" ${checked}><span class="sw" style="background:${col};${dash==='--'?'opacity:.85;background:repeating-linear-gradient(90deg,'+col+' 0 4px,transparent 4px 7px)':''}"></span>${lab}</label>`;
  }).join('');
  $('legend').querySelectorAll('input').forEach(inp=>{
    inp.onchange=()=>{ if(inp.checked) enabled.add(inp.dataset.id); else enabled.delete(inp.dataset.id); draw(); };
  });
}
$('preset').onchange=()=>{
  enabled = new Set(presets[$('preset').value]);
  buildLegend(); draw();
};
$('logY').onchange=$('markH2').onchange=()=>draw();

function draw(){
  const canvas = $('chart');
  const wrap = $('chartWrap');
  const dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#131722'; ctx.fillRect(0,0,W,H);

  const days = D.days;
  const n = days.length;
  const pad = {l:58,r:16,t:16,b:36};
  const plotW = W-pad.l-pad.r, plotH = H-pad.t-pad.b;

  const ids = SM.map(x=>x[0]).filter(id=>enabled.has(id) && D.series[id]);
  if(!ids.length){ ctx.fillStyle='#787b86'; ctx.fillText('勾选至少一条曲线', pad.l, pad.t+20); return; }

  let ymin=Infinity, ymax=-Infinity;
  ids.forEach(id=>{ D.series[id].forEach(v=>{ if(v<ymin)ymin=v; if(v>ymax)ymax=v; }); });
  const logY = $('logY').checked;
  if(logY){ ymin=Math.max(ymin,1e-4); ymax=Math.max(ymax,ymin*1.01); }

  const xAt = i => pad.l + (i/(n-1))*plotW;
  const yAt = v => {
    if(logY){
      const a=Math.log(ymin), b=Math.log(ymax);
      return pad.t + plotH*(1-(Math.log(v)-a)/(b-a));
    }
    return pad.t + plotH*(1-(v-ymin)/(ymax-ymin));
  };

  // grid
  ctx.strokeStyle='#2a2e39'; ctx.lineWidth=1;
  const yTicks = 6;
  for(let i=0;i<=yTicks;i++){
    const t=i/yTicks;
    let v;
    if(logY){ v = Math.exp(Math.log(ymin)+t*(Math.log(ymax)-Math.log(ymin))); }
    else { v = ymin + t*(ymax-ymin); }
    const y = yAt(v);
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
    ctx.fillStyle='#787b86'; ctx.font='11px sans-serif'; ctx.textAlign='right';
    ctx.fillText(v>=10?v.toFixed(1):v.toFixed(2), pad.l-6, y+3);
  }
  // x labels
  const xLabs = [0, Math.floor(n/4), Math.floor(n/2), Math.floor(3*n/4), n-1];
  ctx.textAlign='center';
  xLabs.forEach(i=>{
    const x=xAt(i);
    ctx.strokeStyle='#2a2e39'; ctx.beginPath(); ctx.moveTo(x,pad.t); ctx.lineTo(x,H-pad.b); ctx.stroke();
    ctx.fillStyle='#787b86'; ctx.fillText(days[i], x, H-pad.b+18);
  });

  // H2 marker
  if($('markH2').checked){
    const hi = days.indexOf(D.h2_start);
    if(hi>=0){
      const x=xAt(hi);
      ctx.setLineDash([4,4]); ctx.strokeStyle='#787b86'; ctx.beginPath();
      ctx.moveTo(x,pad.t); ctx.lineTo(x,H-pad.b); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#787b86'; ctx.textAlign='left'; ctx.fillText('H2', x+4, pad.t+12);
    }
  }

  // series
  const metaBy = Object.fromEntries(SM.map(x=>[x[0],x]));
  ids.forEach(id=>{
    const [, , col, dash] = metaBy[id];
    const ys = D.series[id];
    ctx.beginPath();
    ctx.strokeStyle = col; ctx.lineWidth = 1.6;
    if(dash==='--') ctx.setLineDash([6,4]); else ctx.setLineDash([]);
    for(let i=0;i<n;i++){
      const x=xAt(i), y=yAt(ys[i]);
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke(); ctx.setLineDash([]);
  });

  // hover
  canvas.onmousemove = (ev)=>{
    const rect = canvas.getBoundingClientRect();
    const mx = ev.clientX - rect.left;
    const i = Math.round(((mx-pad.l)/plotW)*(n-1));
    if(i<0||i>=n){ $('tip').style.display='none'; return; }
    const tip = $('tip');
    let html = `<b>${days[i]}</b>`;
    ids.forEach(id=>{
      const lab = metaBy[id][1];
      const v = D.series[id][i];
      html += `<div style="color:${metaBy[id][2]}">${lab}: ${v.toFixed(3)}×</div>`;
    });
    tip.innerHTML = html;
    tip.style.display='block';
    tip.style.left = Math.min(mx+12, W-180)+'px';
    tip.style.top = Math.max(8, (ev.clientY-rect.top)-10)+'px';
  };
  canvas.onmouseleave = ()=>{ $('tip').style.display='none'; };
}
buildLegend();
draw();
window.addEventListener('resize', draw);
</script>
</body>
</html>
