<script>
'use strict';
const M = window.__META, LWC = window.LightweightCharts;
const KIND = ['band','eod','nobar','stop'];
const VLAB = {
 avg5_gt2m_none_x5:'mean5>$2M · 跌出前5%平 · 无止损（默认）', avg5_gt2m_none_x50:'mean5>$2M · 跌出前50%平 · 无止损',
 avg5_gt2m_sl20_x5:'mean5>$2M · 跌出前5%平 · SL20', avg5_gt2m_sl20_x50:'mean5>$2M · 跌出前50%平 · SL20',
 unfiltered_none_x5:'不过滤 · 跌出前5%平 · 无止损', unfiltered_none_x50:'不过滤 · 跌出前50%平 · 无止损',
 unfiltered_sl20_x5:'不过滤 · 跌出前5%平 · SL20', unfiltered_sl20_x50:'不过滤 · 跌出前50%平 · SL20'};
const $ = id => document.getElementById(id);
const fmtT = s => { const d = new Date(s*1000); return d.toISOString().slice(0,16).replace('T',' '); };
const fx = (v,d=2) => (v==null||Number.isNaN(v)) ? '—' : Number(v).toFixed(d);
const cls = v => v>0?'pos':(v<0?'neg':'');
// ---------- lazy script loader ----------
const pend = {};
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=()=>{s.remove();res();}; s.onerror=()=>{s.remove();rej(new Error('load '+src));}; document.head.appendChild(s); }); }
const TR = {}; window.__T = (v,col)=>{ TR[v]=col; };
const SYM = new Map(); let symRaw = {}; window.__D = (nm,d)=>{ symRaw[nm]=d; };
async function getTrades(v){ if(!TR[v]) await loadScript('data/trades_'+v+'.js'); return TR[v]; }
async function gunzipB64(b64){
 const bin = atob(b64), u8 = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
 const ds = new DecompressionStream('gzip'); const buf = await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
 return new Int32Array(buf);
}
async function getSym(nm){
 if(SYM.has(nm)){ const d=SYM.get(nm); SYM.delete(nm); SYM.set(nm,d); return d; }
 const safe = nm.replace(/[\/.]/g,'_');
 await loadScript('data/sym/'+encodeURIComponent(safe)+'.js');
 const raw = symRaw[nm]; delete symRaw[nm];
 const out = {bars:[], vol:[], sig:raw.sig||{}};
 if(raw.bars && raw.bars.n){
  const n = raw.bars.n, a = await gunzipB64(raw.bars.b);
  let t = raw.bars.t0 - 900, c = 0;
  for(let i=0;i<n;i++){
   t += a[i]*900; const o = c + a[n+i]; const h = o + a[2*n+i], l = o - a[3*n+i]; c = o + a[4*n+i]; const v = a[5*n+i];
   out.bars.push({time:t, open:o/100, high:h/100, low:l/100, close:c/100, v});
  }
 }
 SYM.set(nm,out); if(SYM.size>40) SYM.delete(SYM.keys().next().value);
 return out;
}
// ---------- chart ----------
const chart = LWC.createChart($('chart'), {
 autoSize:true, layout:{background:{color:'#131722'}, textColor:'#d1d4dc', panes:{separatorColor:'#2a2e39'}},
 grid:{vertLines:{color:'#1f2430'}, horzLines:{color:'#1f2430'}},
 crosshair:{mode:LWC.CrosshairMode.Normal},
 timeScale:{timeVisible:true, secondsVisible:false, borderColor:'#2a2e39', rightOffset:6},
 rightPriceScale:{borderColor:'#2a2e39'}, leftPriceScale:{visible:true,borderColor:'#2a2e39'},
 localization:{timeFormatter:t=>fmtT(t)+' ET'}
});
const cs = chart.addSeries(LWC.CandlestickSeries, {upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350',priceScaleId:'right'});
const vs = chart.addSeries(LWC.HistogramSeries, {priceFormat:{type:'volume'}, priceScaleId:'vol', lastValueVisible:false, priceLineVisible:false});
chart.priceScale('vol').applyOptions({scaleMargins:{top:0.8,bottom:0}});
const eLine = chart.addSeries(LWC.LineSeries,{color:'#f5c542',lineWidth:1,lineStyle:2,lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false});
const slLine = chart.addSeries(LWC.LineSeries,{color:'#ff00aa',lineWidth:1,lineStyle:1,lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false});
const czS = chart.addSeries(LWC.LineSeries,{color:'#42a5f5',lineWidth:1,pointMarkersVisible:true,pointMarkersRadius:2,priceScaleId:'right',title:'cs_z'},1);
const posS = chart.addSeries(LWC.LineSeries,{color:'#ffa726',lineWidth:1,pointMarkersVisible:true,pointMarkersRadius:2,priceScaleId:'left',title:'pos'},1);
const thrS = chart.addSeries(LWC.LineSeries,{color:'#ef5350',lineWidth:1,lineStyle:2,priceScaleId:'left',lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false},1);
chart.panes()[0].setStretchFactor(3); chart.panes()[1].setStretchFactor(1);
const mk = LWC.createSeriesMarkers(cs, []);
const mkSig = LWC.createSeriesMarkers(posS, []);
// ---------- state ----------
let ver = 'avg5_gt2m_none_x5', T = null, idx = [], sel = -1, sortKey = 'et', sortDir = 1, curBars = [], curTrade = null, curSym = null;
const COLS = [['#','i'],['股票','s'],['入场 ET','et'],['原因','k'],['持有','hb'],['kept','ka'],['pos','pos'],['cs_z','cz'],['net bps','n'],['','']];
function buildHead(){ $('thead').innerHTML = COLS.map(([l,k])=>`<div data-k="${k}" class="${k===sortKey?'on':''}">${l}${k===sortKey?(sortDir>0?' ▲':' ▼'):''}</div>`).join(''); }
$('thead').onclick = e=>{ const k=e.target.dataset.k; if(!k) return; if(k===sortKey) sortDir=-sortDir; else {sortKey=k; sortDir=(k==='n'||k==='pos'||k==='cz')?1:1;} applyFilter(true); };
function dayOf(t){ return fmtT(t).slice(0,10); }
function applyFilter(keepSel){
 const tk=$('fTk').value.trim().toUpperCase(), kd=$('fKind').value, d0=$('fD0').value, d1=$('fD1').value;
 const n0=$('fN0').value===''?-Infinity:+$('fN0').value, n1=$('fN1').value===''?Infinity:+$('fN1').value, kept=$('fKept').checked;
 const prevId = sel>=0? idx[sel] : -1;
 const out=[]; const N=T.s.length;
 for(let i=0;i<N;i++){
  if(kept && !T.ka[i]) continue;
  if(kd!=='' && T.k[i]!==+kd) continue;
  const nb=T.n[i]; if(nb<n0||nb>n1) continue;
  if(tk){ const nm=M.syms[T.s[i]]; if(tk.endsWith('*')? !nm.startsWith(tk.slice(0,-1)) : nm!==tk) continue; }
  if(d0||d1){ const d=dayOf(T.et[i]); if(d0&&d<d0) continue; if(d1&&d>d1) continue; }
  out.push(i);
 }
 if(sortKey && sortKey!=='i'){ const a=sortKey==='s'? out.map(i=>M.syms[T.s[i]]) : null; const col=T[sortKey];
  out.sort((x,y)=>{ let u,v; if(sortKey==='s'){u=M.syms[T.s[x]];v=M.syms[T.s[y]]; return sortDir*(u<v?-1:u>v?1:T.et[x]-T.et[y]);} u=col[x];v=col[y]; return sortDir*((u-v)||(T.et[x]-T.et[y])); }); }
 idx=out; buildHead();
 let sm=0,w=0; for(const i of out){ sm+=T.n[i]; if(T.n[i]>0) w++; }
 const ns=new Set(out.map(i=>T.s[i])).size;
 $('stats').innerHTML = `<b>${out.length}</b> 笔 · ${ns} 只股票 · 平均 net <b class="${cls(sm)}">${fx(out.length?sm/out.length:NaN,1)}</b> bps · 胜率 <b>${fx(out.length?100*w/out.length:NaN,1)}%</b> · 版本 ${VLAB[ver]}`;
 sel = keepSel && prevId>=0 ? out.indexOf(prevId) : -1;
 $('tbody').scrollTop = sel>0 ? Math.max(0,(sel-5)*22) : 0;
 renderRows();
}
const RH=22;
function renderRows(){
 const tb=$('tbody'), h=tb.clientHeight, st=tb.scrollTop, a=Math.max(0,Math.floor(st/RH)-10), b=Math.min(idx.length,Math.ceil((st+h)/RH)+10);
 let html=`<div style="height:${idx.length*RH}px"></div>`;
 for(let r=a;r<b;r++){ const i=idx[r];
  html+=`<div class="r${r===sel?' sel':''}" data-r="${r}" style="top:${r*RH}px"><div class="mu">${r+1}</div><div>${M.syms[T.s[i]]}</div><div>${fmtT(T.et[i])}</div><div class="${T.k[i]===3?'neg':''}">${KIND[T.k[i]]}</div><div>${T.hb[i]}</div><div class="mu">${T.ka[i]?'✓':''}</div><div>${fx(T.pos[i],4)}</div><div>${fx(T.cz[i],2)}</div><div class="${cls(T.n[i])}">${fx(T.n[i],1)}</div><div></div></div>`; }
 tb.innerHTML=html;
}
$('tbody').addEventListener('scroll',()=>requestAnimationFrame(renderRows));
$('tbody').addEventListener('click',e=>{ const r=e.target.closest('.r'); if(r) select(+r.dataset.r); });
function ensureVisible(){ const tb=$('tbody'), y=sel*RH; if(y<tb.scrollTop) tb.scrollTop=y; else if(y+RH>tb.scrollTop+tb.clientHeight) tb.scrollTop=y+RH-tb.clientHeight; renderRows(); }
function barIndexAtOrBefore(bars,t){ let lo=0,hi=bars.length-1,r=-1; while(lo<=hi){const m=(lo+hi)>>1; if(bars[m].time<=t){r=m;lo=m+1;} else hi=m-1;} return r; }
const isRTH = t => { const m=Math.floor((t%86400)/60); return m>=570 && m<960; };
let loadTok=0;
async function select(r){
 if(r<0||r>=idx.length) return; sel=r; ensureVisible();
 const i=idx[r], nm=M.syms[T.s[i]], tok=++loadTok;
 $('loading').style.display='flex';
 let d; try{ d=await getSym(nm); } catch(e){ $('loading').style.display='none'; $('info').innerHTML=`<span class="neg">${nm} 数据加载失败：${e.message}</span>`; return; }
 if(tok!==loadTok) return; $('loading').style.display='none';
 const ext=$('optExt').checked;
 if(curSym!==nm || curExt!==ext){
  curBars = ext? d.bars : d.bars.filter(b=>isRTH(b.time));
  cs.setData(curBars);
  vs.setData(curBars.map(b=>({time:b.time,value:b.v,color:b.close>=b.open?'rgba(38,166,154,.45)':'rgba(239,83,80,.45)'})));
  const s=d.sig||{}, cz=[], ps=[];
  if(s.t) for(let k=0;k<s.t.length;k++){ if(s.cz[k]!=null) cz.push({time:s.t[k],value:s.cz[k]}); if(s.p[k]!=null) ps.push({time:s.t[k],value:s.p[k]}); }
  czS.setData(cz); posS.setData(ps);
  thrS.setData(ps.length? [{time:ps[0].time,value:-0.98},{time:ps[ps.length-1].time,value:-0.98}] : []);
  curSym=nm; curExt=ext;
 }
 curTrade=i; drawTrade(i); fitCtx();
}
let curExt=null;
function exitBarT(i){ const k=T.k[i]; return (k===1||k===3)? T.xt[i]-900 : T.xt[i]; }
function drawTrade(i){
 const nm=M.syms[T.s[i]], ms=[], sm=[];
 // EVERY trade of this symbol in this version (selected bright+label; others dim+label)
 let nSame=0;
 for(let j=0;j<T.s.length;j++){ if(T.s[j]!==T.s[i]) continue; nSame++;
  const R=T.rf[j], epC=T.ep[j]*R, xpC=T.xp[j]*R, k=T.k[j], sel=(j===i);
  const ec=sel?'#ff1744':'rgba(239,83,80,.55)', xc=k===3?(sel?'#ff00aa':'rgba(255,0,170,.55)'):(sel?'#00e676':'rgba(38,166,154,.55)');
  const sz=sel?1.4:0.85;
  ms.push({time:T.et[j],position:'aboveBar',color:ec,shape:'arrowDown',size:sz,text:sel?('空 '+fx(epC,2)):('空')});
  ms.push({time:exitBarT(j),position:'belowBar',color:xc,shape:k===3?'circle':'arrowUp',size:sz,text:sel?((k===3?'止损 ':k===1?'16:00 ':'平 ')+fx(xpC,2)):(k===3?'SL':'平')});
  if(sel) ms.push({time:T.dt[j],position:'aboveBar',color:'#b0bec5',shape:'circle',size:0.7,text:'信号'});
 }
 const R=T.rf[i], epC=T.ep[i]*R, xpC=T.xp[i]*R;
 ms.sort((a,b)=>a.time-b.time); mk.setMarkers(ms);
 mkSig.setMarkers([{time:T.dt[i],position:'inBar',color:'#ff1744',shape:'circle',size:1}]);
 const t1=Math.max(T.xt[i],T.et[i]+900);
 eLine.setData([{time:T.et[i],value:epC},{time:t1,value:epC}]);
 slLine.setData(ver.includes('sl20')? [{time:T.et[i],value:epC*1.2},{time:t1,value:epC*1.2}] : []);
 const ret=-(T.xp[i]/T.ep[i]-1)*100;
 $('info').innerHTML=`<span class="big">${nm}</span><span class="k">${VLAB[ver]}</span>
 <span><span class="k">信号bar</span> ${fmtT(T.dt[i])} 收 ${fx(T.dp[i],2)}</span>
 <span><span class="k">入场(空)</span> ${fmtT(T.et[i])} @<b>${fx(T.ep[i],2)}</b></span>
 <span><span class="k">平仓</span> ${fmtT(T.xt[i])} @<b>${fx(T.xp[i],2)}</b> <span class="${T.k[i]===3?'neg':''}">${KIND[T.k[i]]}</span></span>
 <span><span class="k">持有</span> ${T.hb[i]} bar</span>
 <span><span class="k">pos</span> ${fx(T.pos[i],5)} <span class="k">cs_z</span> ${fx(T.cz[i],3)} <span class="k">z</span> ${fx(T.z[i],3)}</span>
 <span><span class="k">gross</span> <b class="${cls(T.g[i])}">${fx(T.g[i],1)}</b> bps <span class="k">net</span> <b class="${cls(T.n[i])}">${fx(T.n[i],1)}</b> bps <span class="k">(价差 ${fx(ret,2)}%)</span></span>
 <span><span class="k">kept_A</span> ${T.ka[i]?'是':'否（资金/仓位上限没进）'}</span>
 ${Math.abs(R-1)>1e-6?`<span class="neg">注意：此股后来拆/合股，图上K线是复权价（×${R}），图上入场 ${fx(epC,2)} / 平仓 ${fx(xpC,2)}；上面写的是当时真实成交价</span>`:''}`;
 $('foot').textContent=`第 ${sel+1}/${idx.length} 笔 · K线 ${curBars.length} 根 (${M.lo}~${M.hi}, ET) · K线为复权价(us_15m_from5m/raw) · 同股每笔交易均标注入场↓/平仓↑（止损为粉圈）；亮色=当前选中笔；黄虚线=入场价，粉线=SL20`;
 $('legend').textContent='';
}
function fitCtx(){
 if(curTrade==null||!curBars.length) return; const i=curTrade, ctx=Math.max(8,+$('optCtx').value||128);
 const ei=barIndexAtOrBefore(curBars,T.et[i]), xi=barIndexAtOrBefore(curBars,exitBarT(i));
 const a=Math.max(0,ei-ctx), b=Math.min(curBars.length-1,Math.max(xi,ei)+12);
 chart.timeScale().setVisibleRange({from:curBars[a].time,to:curBars[b].time});
}
chart.subscribeCrosshairMove(p=>{ if(!p||!p.time){ $('legend').textContent=''; return; } const b=p.seriesData.get(cs), z=p.seriesData.get(czS), q=p.seriesData.get(posS);
 let s=fmtT(p.time)+' ET'; if(b) s+=`  O ${fx(b.open)} H ${fx(b.high)} L ${fx(b.low)} C ${fx(b.close)}`; const vb=p.seriesData.get(vs); if(vb) s+=`  V ${vb.value.toLocaleString()}`; if(z) s+=`  cs_z ${fx(z.value,3)}`; if(q) s+=`  pos ${fx(q.value,5)}`; $('legend').textContent=s; });
// ---------- controls ----------
function step(d){ if(!idx.length) return; select(sel<0?0:Math.min(idx.length-1,Math.max(0,sel+d))); }
$('bPrev').onclick=()=>step(-1); $('bNext').onclick=()=>step(1); $('bFit').onclick=fitCtx; $('bAll').onclick=()=>chart.timeScale().fitContent();
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
 if(e.key==='ArrowDown'||e.key==='j'||e.key==='J'){e.preventDefault();step(1);} else if(e.key==='ArrowUp'||e.key==='k'||e.key==='K'){e.preventDefault();step(-1);}
 else if(e.key==='f'||e.key==='F') fitCtx(); else if(e.key==='a'||e.key==='A') chart.timeScale().fitContent(); });
let ft; for(const id of ['fTk','fD0','fD1','fN0','fN1']) $(id).addEventListener('input',()=>{clearTimeout(ft);ft=setTimeout(()=>applyFilter(true),200);});
for(const id of ['fKind','fKept']) $(id).addEventListener('change',()=>applyFilter(true));
$('optExt').addEventListener('change',()=>{ curSym=null; if(sel>=0) select(sel); });
$('optCtx').addEventListener('change',fitCtx);
$('ver').innerHTML=M.vers.map(v=>`<option value="${v}">${VLAB[v]||v}</option>`).join('');
$('ver').onchange=async()=>{ ver=$('ver').value; T=await getTrades(ver); curSym=null; applyFilter(false); if(idx.length) select(0); };
// results table
(function(){ const R=window.__RES; if(!R){ $('btnRes').style.display='none'; return; }
 const lab={none_x50:'跌出前50% · 无止损',none_x5:'跌出前5% · 无止损',sl20_x50:'跌出前50% · SL20',sl20_x5:'跌出前5% · SL20'}, hn={VAL:'VAL',H1:'H1',H2:'H2'};
 const by={}; for(const r of (R.rows||[])){ const k=r.half+'|'+r.exit; by[k]=by[k]||{}; by[k][r.filter]=r; }
 let h='<table><tr><th>区间</th><th>规则</th><th colspan="4">不过滤 CAGR/Sh/MDD/n</th><th colspan="4">mean5>$2M CAGR/Sh/MDD/n</th></tr>';
 for(const half of ['VAL','H1','H2']) for(const ex of ['none_x50','none_x5','sl20_x50','sl20_x5']){
  const g=by[half+'|'+ex]; if(!g) continue;
  h+=`<tr><td>${hn[half]}</td><td style="text-align:left">${lab[ex]}</td>`;
  for(const f of ['unfiltered','avg5_gt2m']){ const r=g[f]||{}; const c=r.cagr, sh=r.sharpe, m=r.mdd, n=r.n_kept_A;
   h+=`<td>${c==null?'—':(c*100).toFixed(0)+'%'}</td><td>${sh==null||sh!==sh?'—':(+sh).toFixed(2)}</td><td>${m==null?'—':(m*100).toFixed(0)+'%'}</td><td>${n==null?'—':n}</td>`; }
  h+='</tr>'; }
 const fs=R.filter_stats||{};
 h+=`</table><div class="mu" style="margin:0 8px 6px">${R.note||''} · 空头信号未筛 ${fs.n_short_unf||'—'} → mean5>$2M ${fs.n_short_liq||'—'}（保留 ${fs.frac_short_kept!=null?(100*fs.frac_short_kept).toFixed(1)+'%':'—'}）</div>`;
 if(R.weekly && R.weekly.avg5_gt2m_none_x5){
  const w=R.weekly.avg5_gt2m_none_x5; let pos=0,sm=0; for(const x of w){ sm+=x.r; if(x.r>0)pos++; }
  h+=`<div class="mu" style="margin:0 8px 8px">周收益 mean5>$2M · x5：n=${w.length} 均 ${((sm/Math.max(w.length,1))*100).toFixed(2)}% 赚钱周 ${(100*pos/Math.max(w.length,1)).toFixed(0)}%</div>`;
 }
 $('res').innerHTML=h; $('btnRes').onclick=()=>$('res').classList.toggle('open'); })();
(async()=>{ $('ver').value=ver; T=await getTrades(ver); applyFilter(false); if(idx.length) select(0); })();
</script>
</body>
</html>
